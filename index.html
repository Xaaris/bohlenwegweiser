<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bohlenwegweiser</title>
    <meta
      name="description"
      content="Finde Bohlenwege, Moorstege und Holzstege in deiner Umgebung, auf Basis von OpenStreetMap."
    />
    <meta name="theme-color" content="#315f49" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23315f49'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h32' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="shell">
      <main class="map-wrap">
        <div id="map"></div>
        <!-- aria-hidden on both: the status line already says the same thing. -->
        <div id="mapBusy" class="map-busy" aria-hidden="true" hidden>
          Lade Wegedaten …
        </div>
        <div id="zoomHint" class="zoom-hint" aria-hidden="true" hidden>
          Hineinzoomen, um Bohlenwege zu sehen
        </div>
      </main>

      <aside class="panel">
        <!-- Only shown on narrow screens; see the media query in styles.css. -->
        <button id="sheetToggle" class="sheet-handle" type="button" aria-expanded="true">
          <span class="sheet-grip" aria-hidden="true"></span>
          <span class="sheet-label">Liste einklappen</span>
        </button>

        <header>
          <h1>Bohlenwegweiser</h1>
          <p id="status" class="status" role="status" aria-live="polite">
            Karte verschieben oder hineinzoomen.
          </p>
        </header>

        <div class="controls">
          <button id="locateButton" type="button">Mein Standort</button>
          <label>
            <span>ab</span>
            <select id="minLengthSelect">
              <option value="0">alle Längen</option>
              <option value="25">25 m</option>
              <option value="50" selected>50 m</option>
              <option value="100">100 m</option>
              <option value="200">200 m</option>
              <option value="500">500 m</option>
            </select>
          </label>
        </div>

        <ol id="results" class="results"></ol>

        <footer>
          Daten von
          <a
            href="https://www.openstreetmap.org/copyright"
            target="_blank"
            rel="noopener noreferrer"
            >OpenStreetMap</a
          >
          (ODbL). Ob ein Weg wirklich ein Bohlenweg ist, wird anhand der OSM-Tags
          geschätzt und kann falsch sein.
        </footer>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
